name: Build and Release

on:
  push:
    branches:
      - grill-my-code
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu --all-features
        env:
          RUSTFLAGS: -C target-feature=+crt-static -C link-arg=-static -C link-arg=-no-pie

      - name: Strip binary
        run: strip target/x86_64-unknown-linux-gnu/release/rmcm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmcm-linux-x86_64
          path: target/x86_64-unknown-linux-gnu/release/rmcm

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: rmcm-linux-x86_64
          path: release-assets

      - name: Rename binary for release
        run: mv release-assets/rmcm release-assets/rmcm-linux-x86_64

      - name: Publish rolling grill-my-code release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Automatically built from the \`grill-my-code\` branch at ${{ github.sha }}."

          if gh release view grill-my-code --repo "${{ github.repository }}" &>/dev/null; then
            # Release already exists — just refresh the notes and overwrite the asset.
            gh release edit grill-my-code \
              --repo "${{ github.repository }}" \
              --notes "$NOTES"
          else
            # First run — create the release.
            gh release create grill-my-code \
              --repo "${{ github.repository }}" \
              --target grill-my-code \
              --title "Latest (grill-my-code)" \
              --notes "$NOTES"
          fi

          gh release upload grill-my-code \
            release-assets/rmcm-linux-x86_64 \
            --repo "${{ github.repository }}" \
            --clobber
