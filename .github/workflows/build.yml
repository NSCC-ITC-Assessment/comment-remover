name: Build and Release

on:
  push:
    branches:
      - grill-my-code

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu --all-features
        env:
          RUSTFLAGS: -C target-feature=+crt-static -C link-arg=-static -C link-arg=-no-pie

      - name: Strip binary
        run: strip target/x86_64-unknown-linux-gnu/release/rmcm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmcm-linux-x86_64
          path: target/x86_64-unknown-linux-gnu/release/rmcm

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: rmcm-linux-x86_64
          path: release-assets

      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete the previous 'latest' release (and its tag) so the tag
          # re-points to the new grill-my-code HEAD on recreate.
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true

          # Create a fresh 'latest' release pinned to this commit.
          gh release create latest \
            --repo "${{ github.repository }}" \
            --target grill-my-code \
            --title "Latest (grill-my-code)" \
            --notes "Automatically built from the \`grill-my-code\` branch at ${{ github.sha }}." \
            release-assets/rmcm#rmcm-linux-x86_64
